# Contoh Nginx reverse proxy untuk VPS. Simpan sebagai
# /etc/nginx/sites-available/dailyai lalu symlink ke sites-enabled.
# Ganti chatbot.anda.id dengan domain Anda, lalu: certbot --nginx -d chatbot.anda.id
server {
    listen 80;
    server_name chatbot.anda.id;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
